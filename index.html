<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Escape the maze, ban a move, and challenge a friend.">
  <meta name="rulereaper-build" content="development">
  <title>RuleReaper</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <header>
      <h1>Rule<span>Reaper</span></h1>
      <p class="tagline">Escape the maze. Ban a move. Make the next escape harder.</p>
      <button id="reloadVersion" class="update" hidden>A new version is out. Tap to reload.</button>
    </header>
    <nav id="mazes" class="mazes" aria-label="Choose a maze"></nav>
    <section class="panel" aria-labelledby="mazeTitle">
      <div class="puzzle-heading">
        <h2 id="mazeTitle" tabindex="-1"></h2>
        <div class="stats">
          <span>Moves <strong id="moves">0</strong></span>
          <span>Rules <strong id="count">0 / 8</strong></span>
        </div>
      </div>
      <div id="rules" class="rules" aria-label="Banned moves"></div>
      <p id="help" class="help"></p>
      <div id="grid" class="grid" aria-label="5 by 5 maze"></div>
      <p id="status" role="status"></p>
      <div class="actions">
        <button id="undo">Undo</button>
        <button id="reset">Restart route</button>
        <button id="fresh">Clear rules</button>
      </div>
    </section>
    <section id="win" class="panel win" hidden aria-labelledby="winTitle">
      <h2 id="winTitle" tabindex="-1">You escaped.</h2>
      <p id="winHelp"></p>
      <div id="choices" class="choices"></div>
      <button id="nextMaze" class="primary" hidden></button>
    </section>
    <section class="panel">
      <h2>Challenge a friend</h2>
      <p>Send them this maze with your current rules.</p>
      <button id="share" class="primary">Copy challenge link</button>
      <input id="shareLink" aria-label="Challenge link" readonly>
      <p id="shareStatus" role="status" hidden></p>
    </section>
  </main>
  <script type="module" src="./src/app.mjs"></script>
</body>
</html>
